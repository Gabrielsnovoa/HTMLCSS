<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>exemplo de formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on">  
        <p>
            <label for="iest">estado</label>
            <select name="estado" id="iest">
                <option value=""selected>---escolha---</option>
                <optgroup label="bostil">
                    <option value="ma" selected> maranhão</option>
                    <option value="sp">são paulo</option>
                    <option value="ac">acre</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="iprof">profissão</label>
            <input type="text" name="prof" id="iprof" list="istprof">
            <datalist id="istprof">
                <option >administrador</option>
                <option >desenvolvidor</option>
            </datalist>
        </p>
        <p>
            <label for="imsg">menssagem</label><br>
            <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
