<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>exemplo de formlario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
    <fieldset>
        <legend>Sexo</legend>

        <input type="radio" name="sexo" id="isxmas"> 
        <label for="isxmas">Masculino</label><br>

        <input type="radio" name="sexo" id="isxfem" checked> 
        <label for="isxfem" >Feminino</label><br>
    </fieldset>
    <fieldset>
        <legend>esportes favoritos</legend>
        <input type="checkbox" name="esfut" id="iesfut" checked > <label for="iesfut">futebol</label> <br>
        <input type="checkbox" name="esbas" id="iesbes" > <label for="iesbes">basquete</label> <br>
        <input type="checkbox" name="esnat" id="iesnat" > <label for="iesnat">natação </label><br>
        <input type="checkbox" name="esten" id="iesten" > <label for="iesten">tênis</label> <br>
    </fieldset>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
